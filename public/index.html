<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PGD Market, bibliothèque de produits numériques.">
  <title data-i18n-title="siteName">PGD Market | Produits numériques</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body data-page="home">
  <header class="site-header" data-header></header>
  <main>
    <section class="hero container">
      <div class="hero-copy reveal">
        <p class="eyebrow" data-i18n="home.eyebrow"></p>
        <h1 data-i18n="home.title"></h1>
        <p class="hero-text" data-i18n="home.description"></p>
        <div class="hero-actions"><a class="button button-primary" href="boutique.html"><span
              data-i18n="home.cta"></span> <span aria-hidden="true">→</span></a><a class="button button-outline"
            href="boutique.html" data-i18n="home.viewProducts"></a></div>
      </div>
      <div class="hero-panel reveal" aria-label="PGD Market">
        <span class="hero-mark">PGD</span>
        <span>MARKET</span>
        <small data-i18n="home.eyebrow"></small>
      </div>
    </section>
    <section class="section container" aria-labelledby="featured-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="home.sectionEyebrow"></p>
          <h2 id="featured-title" data-i18n="home.sectionTitle"></h2>
        </div><a class="text-link" href="boutique.html" data-i18n="home.viewAll"></a>
      </div>
      <div id="featured-products" class="product-grid"></div>
    </section>
    <section class="trust-band">
      <div class="container trust-grid">
        <div><strong data-i18n="home.trustDigital"></strong><span data-i18n="home.trustDigitalText"></span></div>
        <div><strong data-i18n="home.trustPayment"></strong><span data-i18n="home.trustPaymentText"></span></div>
        <div><strong data-i18n="home.trustSupport"></strong><span data-i18n="home.trustSupportText"></span></div>
      </div>
    </section>
    <section class="section container reviews-section" aria-labelledby="reviews-title">
      <p class="eyebrow" data-i18n="extra.reviewsEyebrow"></p>
      <h2 id="reviews-title" data-i18n="extra.reviewsTitle"></h2>
      <div class="empty-reviews">
        <p data-i18n="extra.reviewsEmpty"></p>
      </div>
    </section>
    <section class="section container faq-section" aria-labelledby="faq-title">
      <p class="eyebrow" data-i18n="home.faqEyebrow"></p>
      <h2 id="faq-title" data-i18n="home.faqTitle"></h2>
      <details>
        <summary data-i18n="home.faqBuy"></summary>
        <p data-i18n="home.faqBuyText"></p>
      </details>
      <details>
        <summary data-i18n="home.faqDelivery"></summary>
        <p data-i18n="home.faqDeliveryText"></p>
      </details>
      <details>
        <summary data-i18n="home.faqContact"></summary>
        <p data-i18n="home.faqContactText"></p>
      </details>
    </section>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
