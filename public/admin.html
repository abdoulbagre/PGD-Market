<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Administration | PGD Market</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <a class="admin-brand" href="index.html" aria-label="PGD Market, accueil">PGD <span>MARKET</span></a>
      <p>Espace administration</p>
    </header>

    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="admin-kicker">PGD Market</p>
      <h1 id="auth-title">Connexion administrateur</h1>
      <p id="auth-description" class="auth-description">Connectez-vous avec votre compte administrateur invité.</p>

      <form id="login-form" class="auth-form" novalidate>
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">Se connecter</button>
        <button id="forgot-password" class="text-button" type="button">Mot de passe oublié</button>
      </form>

      <form id="recovery-request-form" class="auth-form" hidden novalidate>
        <label for="recovery-email">Adresse e-mail du compte</label>
        <input id="recovery-email" name="email" type="email" autocomplete="email" required>
        <button class="button button-primary" type="submit">Envoyer le lien de récupération</button>
        <button class="text-button" type="button" data-show-login>Retour à la connexion</button>
      </form>

      <form id="new-password-form" class="auth-form" hidden novalidate>
        <label for="new-password">Nouveau mot de passe</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">Confirmer le mot de passe</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="button button-primary" type="submit">Enregistrer le mot de passe</button>
      </form>

      <section id="session-panel" class="session-panel" hidden aria-live="polite">
        <p id="session-message"></p>
        <button id="logout-button" class="button button-outline" type="button">Se déconnecter</button>
      </section>

      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
    </section>

    <footer class="admin-footer">Accès réservé aux comptes administrateur invités.</footer>
  </main>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
