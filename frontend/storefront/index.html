  <script>
    const identityCallbackParams = new URLSearchParams(window.location.hash.slice(1));
    const hasIdentityToken = ["recovery_token", "invite_token"]
      .some((key) => identityCallbackParams.get(key));

    if (window.location.pathname === "/" && hasIdentityToken) {
      window.location.replace(`/admin.html${window.location.hash}`);
    }
  </script>

<body data-page="home">
  <header class="site-header" data-header></header>
  <main>
    <section class="hero container">
      <div class="hero-copy reveal">
        <h1><span data-i18n="home.title"></span> <span data-i18n="home.titleAccent"></span></h1>
        <p class="hero-text" data-i18n="home.description"></p>
        <div class="hero-actions"><a class="button button-primary" href="boutique.html"><span
              data-i18n="home.cta"></span> <span aria-hidden="true">→</span></a><a class="button button-outline"
            href="#featured-title" data-i18n="home.viewProducts"></a></div>
        <ul class="hero-points" aria-label="Points forts du catalogue">
          <li>Guides pratiques</li>
          <li>Livraison instantanée</li>
          <li>Contenu actionnable</li>
        </ul>
        <p class="hero-note">Ressources pratiques · Format numérique</p>
      </div>
      <div id="home-hero-products" class="hero-art reveal" aria-hidden="true"></div>
    </section>
    <section class="section container" aria-labelledby="featured-title">
      <div class="section-heading">
        <div>
          <h2 id="featured-title" data-i18n="home.sectionTitle"></h2>
        </div><a class="text-link" href="boutique.html" data-i18n="home.viewAll"></a>
      </div>
      <div id="featured-products" class="product-grid"></div>
    </section>
    <section class="trust-band">
      <div class="container trust-grid">
        <div><strong data-i18n="home.trustDigital"></strong><span data-i18n="home.trustDigitalText"></span></div>
        <div><strong data-i18n="home.trustPayment"></strong><span data-i18n="home.trustPaymentText"></span></div>
        <div><strong data-i18n="home.trustSupport"></strong><span data-i18n="home.trustSupportText"></span></div>
      </div>
    </section>
    <section class="section container faq-section" aria-labelledby="faq-title">
      <h2 id="faq-title" data-i18n="home.faqTitle"></h2>
      <details>
        <summary data-i18n="home.faqBuy"></summary>
        <p data-i18n="home.faqBuyText"></p>
      </details>
      <details>
        <summary data-i18n="home.faqDelivery"></summary>
        <p data-i18n="home.faqDeliveryText"></p>
      </details>
      <details>
        <summary data-i18n="home.faqContact"></summary>
        <p data-i18n="home.faqContactText"></p>
      </details>
    </section>
  </main>
